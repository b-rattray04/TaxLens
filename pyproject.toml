[project]
name = "taxlens"
version = "0.1.0"
description = "Question answering over Irish Revenue Tax and Duty Manuals, with citations and an evaluation harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",            # HTTP client for the crawler
    "selectolax>=0.3",        # fast HTML parsing for the manual index pages
    "pymupdf>=1.24",          # PDF text extraction, page by page
    "psycopg[binary]>=3.2",   # Postgres driver
    "pydantic-settings>=2.4", # typed config from .env
    "typer>=0.12",            # CLI
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
taxlens = "taxlens.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs the Postgres container running (docker compose up -d)"]

[tool.mypy]
strict = true
files = ["src", "tests"]
# PyMuPDF has incomplete type hints; let strict mode accept calls into it.
untyped_calls_exclude = ["pymupdf"]
